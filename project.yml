name: TmuxRooms
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TmuxRoomsCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Terminal
      - Sources/Supervisor
    settings:
      base:
        PRODUCT_NAME: TmuxRoomsCore

  tmuxrooms-launch:
    type: tool
    platform: macOS
    sources:
      - Sources/Launcher
    dependencies:
      - target: TmuxRoomsCore
    settings:
      base:
        PRODUCT_NAME: tmuxrooms-launch
        EXECUTABLE_NAME: tmuxrooms-launch
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Tmux Rooms Local Development
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # The target name differs from the product name on purpose: `tmuxrooms` and the
  # app's `TmuxRooms` differ only by case, and the default macOS filesystem treats
  # them as one file, which made one scheme overwrite the other.
  tmuxrooms-cli:
    type: tool
    platform: macOS
    sources:
      - Sources/CLI
    dependencies:
      - target: TmuxRoomsCore
    settings:
      base:
        PRODUCT_NAME: tmuxrooms
        EXECUTABLE_NAME: tmuxrooms
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Tmux Rooms Local Development
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  TmuxRooms:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - target: TmuxRoomsCore
      - target: tmuxrooms-launch
        link: false
        embed: false
    entitlements:
      path: Sources/App/TmuxRooms.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Tmux Rooms
        CFBundleName: Tmux Rooms
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSAppleEventsUsageDescription: Tmux Rooms uses Apple Events to select and focus the exact iTerm tab that owns a verified tmux client.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tellang.tmuxrooms
        PRODUCT_NAME: Tmux Rooms
        EXECUTABLE_NAME: TmuxRooms
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/App/TmuxRooms.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Tmux Rooms Local Development
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Embed tmuxrooms-launch
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/tmuxrooms-launch
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/tmuxrooms-launch
        script: |
          set -euo pipefail
          helper_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          helper_path="${helper_dir}/tmuxrooms-launch"
          mkdir -p "${helper_dir}"
          /usr/bin/ditto "${BUILT_PRODUCTS_DIR}/tmuxrooms-launch" "${helper_path}"
          chmod 755 "${helper_path}"
          /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --options runtime --timestamp=none "${helper_path}"

  TmuxRoomsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/App/RoomActions.swift
      - Sources/App/RoomsStore.swift
      - Sources/App/RefreshCadence.swift
      - Sources/CLI/RoomQuery.swift
      - Sources/CLI/RoomFormat.swift
      - Sources/CLI/ChooserInput.swift
      - Sources/CLI/HelpText.swift
      - Sources/CLI/AgentStyle.swift
      - Tests/App
      - Tests/CLI
      - Tests/Core
      - Tests/Terminal
      - Tests/Integration
    dependencies:
      - target: TmuxRoomsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tellang.tmuxrooms.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO

  TmuxRoomsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UI
    dependencies:
      - target: TmuxRooms
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tellang.tmuxrooms.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  TmuxRooms:
    build:
      targets:
        TmuxRooms: all
        TmuxRoomsCore: [test]
        tmuxrooms-launch: [run]
        TmuxRoomsTests: [test]
        TmuxRoomsUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - TmuxRoomsTests
        - TmuxRoomsUITests
  tmuxrooms-cli:
    build:
      targets:
        tmuxrooms-cli: all
  TmuxRoomsUnitTests:
    build:
      targets:
        TmuxRoomsTests: [test]
    test:
      targets:
        - TmuxRoomsTests
  TmuxRoomsUITests:
    build:
      targets:
        TmuxRoomsUITests: [test]
    test:
      targets:
        - TmuxRoomsUITests
